# Host ports can be changed without editing this file, e.g. NEXUS_FALKORDB_PORT=6390 docker compose up.
services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "${NEXUS_FALKORDB_PORT:-6379}:6379"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "${NEXUS_API_PORT:-8000}:8000"
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      CORS_ORIGINS: "http://localhost:${NEXUS_WEB_PORT:-3000},http://127.0.0.1:${NEXUS_WEB_PORT:-3000}"
    volumes:
      - api_var:/app/api/var
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXUS_API_URL: http://api:8000
    ports:
      - "${NEXUS_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mcp:
    image: falkordb/mcpserver:latest
    ports:
      - "${NEXUS_MCP_PORT:-8080}:8080"
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      MCP_TRANSPORT: http
      MCP_PORT: "8080"
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  falkordb_data:
  api_var:
